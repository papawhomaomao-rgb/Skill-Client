name = "skilled-cloud"
main = "src/index.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# wrangler kv namespace create SKILLED
# then paste the id below (and one for --preview)
[[kv_namespaces]]
binding = "SKILLED"
id = "c058e550df6f4d028d7e31043f5d42ae"
preview_id = "6ac1d32aaf7c4a32811a46939fb5b03c"

[vars]
# The origin link.html is served from. verify_url is built off this.
# Must be the real deployed domain, no trailing slash.
SITE_ORIGIN = "https://skillv1.vercel.app"
# Comma-separated list of browser origins allowed to call the CORS routes.
ALLOWED_ORIGINS = "https://skillv1.vercel.app,https://skilled.gg,http://localhost:3000"

# ─── developer accounts ─────────────────────────────────────────────────────
#
# Who gets the developer dashboard: broadcasts, the account roster, and the
# power to revoke anyone's launcher session. Comma-separated, matched against
# addresses Clerk has VERIFIED for the account — an unverified address never
# counts, so claiming one of these at sign-up grants nothing.
#
# Adding someone is this line plus `npx wrangler deploy`. Removing them is the
# same edit in reverse; it takes effect on the next request, with no session to
# hunt down. Clerk public_metadata.role = "dev" still works as a second route
# in for granting access without a deploy.
#
# Mirror this in DEV_EMAILS at the top of ../auth.jsx — that copy only decides
# whether the browser draws the developer UI. This one is the gate.
DEV_EMAILS = "papawhomaomao@gmail.com"

# ─── payments ───────────────────────────────────────────────────────────────
#
# The gate. While this is anything but "true", every signed-in account passes
# hasEntitlement() regardless of what is in KV — the launch position from
# LAUNCHER-AUTH-v1.md, kept so that deploying the payment layer does not lock
# out existing accounts on the way in.
#
# Flip to "true" only once real ent: records are landing from real purchases
# and anyone who bought earlier has been backfilled. One redeploy to roll back.
ENTITLEMENT_ENFORCED = "false"

# Which adapter /api/checkout uses when the request does not name one.
PAYMENT_PROVIDER = "stripe"

# Stripe price ids, one per plan key in src/plans.js: STRIPE_PRICE_<PLAN>.
#
# They live here rather than in plans.js because a price id is a different
# object in test mode and in live mode, and the same source tree has to be able
# to point at either. Leave one empty and that plan's checkout is built inline
# from the amount in plans.js instead — it charges the right money, but Stripe
# creates a throwaway Product per session and its reporting becomes useless.
# Fill both in before launch.
STRIPE_PRICE_LIFETIME = ""
STRIPE_PRICE_MONTHLY = ""

# wrangler secret put CLERK_SECRET_KEY
# wrangler secret put STRIPE_SECRET_KEY       # sk_live_… (sk_test_… while testing)
# wrangler secret put STRIPE_WEBHOOK_SECRET   # whsec_…, shown once when the
#                                             # endpoint is created in Stripe
#
# Both Stripe secrets or neither: with only the key set, /api/plans reports
# configured:false and /api/checkout answers 503, deliberately. A checkout with
# no webhook secret behind it takes the money and grants nothing.
#
# If a second provider is ever added:
#   wrangler secret put PAYPAL_CLIENT_ID
#   wrangler secret put PAYPAL_CLIENT_SECRET
#   wrangler secret put PAYPAL_WEBHOOK_ID
